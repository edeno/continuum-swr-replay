name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-progress runs when a new commit lands on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test ends the job here instead of at GitHub's six-hour limit.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Every push runs the whole suite: the fast tests on both Pythons, and
      # the slow ones (Monte Carlo and end-to-end, `@pytest.mark.slow`) once,
      # in parallel, since they take about half the time on the 2-CPU runner.
      matrix:
        python-version: ["3.11", "3.12"]
        tests: ["not slow"]
        include:
          - python-version: "3.11"
            tests: "slow"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # --frozen installs exactly what uv.lock pins, without re-solving it.
      - name: Install dependencies
        run: uv sync --frozen --extra dev --python ${{ matrix.python-version }}

      - name: Check formatting
        run: uv run --frozen --python ${{ matrix.python-version }} ruff format --check src scripts tests

      - name: Lint
        run: uv run --frozen --python ${{ matrix.python-version }} ruff check src scripts tests

      # -rs lists each skipped test with its reason: the bit-for-bit fold-fit
      # tests skip on a runner that does not repeat the library's computation.
      - name: Run tests
        run: uv run --frozen --python ${{ matrix.python-version }} pytest -q -rs -m "${{ matrix.tests }}"

  manuscript:
    # Builds paper/main.pdf from the committed sources, figures and macros, as
    # `make manuscript` does locally, and fails on an undefined citation or
    # reference, which LaTeX itself reports only as a warning.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        # The TeX Live collections holding the packages paper/main.tex loads
        # (authblk and pdflscape are in latex-extra; lmodern is its own package).
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern

      - name: Build the manuscript
        run: make manuscript

      - name: Check for undefined citations and references
        run: |
          if grep -E "(Citation|Reference) .* undefined" paper/main.log; then
            exit 1
          fi
