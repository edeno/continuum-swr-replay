[project]
name = "continuum-swr-replay"
version = "0.1.0"
description = "Analysis of continuum hippocampal replay during Sharp Wave Ripples in a spatial bandit task."
readme = "README.md"
authors = [{ name = "Eric Denovellis", email = "eric.denovellis@ucsf.edu" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core scientific computing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "xarray>=2023.1.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # Machine learning & JAX (CPU by default; install `cuda` extra for GPU)
    "jax>=0.4.4",

    # Statistical analysis
    "statsmodels>=0.14.0",
    "patsy>=0.5.3",
    "scikit-learn>=1.3.0",  # KFold for rate-model cross-validation
    "diptest>=0.8",  # Hartigan's dip test (one class or two, Part 2)
    "joblib>=1.3.0",
    "networkx>=3.0",

    # Neuroscience packages
    "non_local_detector @ git+https://github.com/LorenFrankLab/non_local_detector.git",
    "spyglass-neuro @ git+https://github.com/LorenFrankLab/spyglass.git",
    "ripple-detection",       # pinned to a commit in [tool.uv.sources]
    # spyglass.spikesorting.v0 imports kachery_cloud at import time, but
    # Spyglass lists it only under an extra.
    "kachery-cloud>=0.4.0",

    # Visualization
    "holoviews>=1.17.0",
    "panel>=1.2.0",
    "tqdm>=4.65.0",

    # High-performance computing
    "dask>=2023.1.0",
    "dask[distributed]",
    "pyarrow>=14.0.0",

    # NetCDF support for large files (>2GB)
    "netcdf4>=1.6.0",
    "h5netcdf>=1.0.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "jupyterlab>=4.0.0",
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.4.0",
    "hypothesis>=6.0.0",
    "pytest-cov>=7.1.0",
]

# CUDA-accelerated JAX (Linux-only wheels). The plugin is named directly, not
# as jax[cuda12]: the jax entry in [tool.uv] override-dependencies replaces every
# requirement on jax, extras included, so jax[cuda12] locked no CUDA packages.
# Keep the plugin's version equal to the locked jaxlib's.
cuda = [
    "jax-cuda12-plugin[with-cuda]==0.8.0; sys_platform == 'linux'",
]

# GPU acceleration for Dask (optional, Linux-only)
gpu = [
    "continuum-swr-replay[cuda]",
    "dask-cuda>=24.12.0",
    "cuda-bindings>=12.0.0",  # Required by dask-cuda but not declared as dependency
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# E402 only — the file has imports below a TYPE_CHECKING block which
# triggers module-import-not-at-top-of-file. F401 stays ON file-wide so
# any future genuinely-unused import in this 1000+ line data loader
# surfaces; ruff already recognizes TYPE_CHECKING imports as used given
# the file's ``from __future__ import annotations``.
"src/continuum_swr_replay/data_loaders/bandit_task.py" = ["E402"]
# Archived figure scripts retained for historical reference; not linted.
"scripts/figures/archive/**" = ["ALL"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# Stricter type checking suitable for scientific repositories
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Allow missing imports since many scientific packages lack type stubs
ignore_missing_imports = true
# Scientific code often uses dynamic types appropriately
allow_any_generics = true

[tool.pytest.ini_options]
# ``testpaths = ["tests"]`` already keeps collection out of ``src/``;
# the previous ``collect_ignore_glob`` entry triggered a
# ``PytestConfigWarning: Unknown config option`` because that hook is
# only honored at the conftest module level, not in the ini config.
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "real_data: reads Processed-Data, a raw NWB file or the Spyglass DB; skipped unless run with '-m real_data'",
]

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
# Spyglass HEAD pins numpy<2 / scipy<1.13 / jax<0.7.2 with
# "TODO(#1609): remove with SpikeInterface bump" -- the pin exists for
# SpikeInterface's spike-sorting paths, which this project does not use (we
# consume trials, DIO, position and LFP). Accepting those pins would downgrade
# numpy below 2, and every artifact in Processed-Data is a numpy-2 pickle:
# the decode outputs alone are ~589 MB per session and cost days of GPU, so
# they cannot simply be regenerated. Override the transitive pins to keep
# numpy 2 while taking Spyglass HEAD for pynwb>=3.1.3, which is what the
# restored NWB files (core schema 2.9.0) require.
override-dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "jax>=0.7.2",
]

[tool.uv.sources]
# 68e1784 is the changelog's 2.0.0, never tagged, so the installed version string
# (1.7.2.dev365+g68e1784b1) comes from the last tag and does not identify it.
ripple-detection = { git = "https://github.com/Eden-Kramer-Lab/ripple_detection.git", rev = "9766fd4875ff2372ebe94f27182af0f7c9f4db5e" }
