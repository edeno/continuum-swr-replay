[project]
name = "continuum-swr-replay"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Eric Denovellis", email = "eric.denovellis@ucsf.edu" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    # Core scientific computing
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",
    "xarray>=2023.1.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # Machine learning & JAX
    "jax[cuda12]>=0.4.4",
    "optax",

    # Statistical analysis
    "statsmodels>=0.14.0",
    "patsy>=0.5.3",
    "joblib>=1.3.0",
    "networkx>=3.0",

    # Neuroscience packages
    "non_local_detector @ git+https://github.com/LorenFrankLab/non_local_detector.git",
    "spyglass-neuro @ git+https://github.com/LorenFrankLab/spyglass.git",
    "kachery",                # database access
    "kachery-client",
    "kachery-cloud>=0.4.0",

    # Visualization
    "holoviews>=1.17.0",
    "panel>=1.2.0",
    "tqdm>=4.65.0",

    # High-performance computing
    "dask>=2023.1.0",
    "dask[distributed]",
    "pyarrow>=14.0.0",

    # NetCDF support for large files (>2GB)
    "netcdf4>=1.6.0",
    "h5netcdf>=1.0.0",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "jupyterlab>=4.0.0",
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.4.0",
    "hypothesis>=6.0.0",
]

# GPU acceleration (optional)
gpu = [
    "dask-cuda>=24.12.0",
    "cuda-bindings>=12.0.0",  # Required by dask-cuda but not declared as dependency
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# Allow imports after TYPE_CHECKING blocks (standard pattern to avoid circular imports)
# Also allow "unused" imports in TYPE_CHECKING blocks - they're used by type checkers
"src/continuum_swr_replay/data_loaders/bandit_task.py" = ["E402", "F401"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# Stricter type checking suitable for scientific repositories
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Allow missing imports since many scientific packages lack type stubs
ignore_missing_imports = true
# Scientific code often uses dynamic types appropriately
allow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[project.scripts]
continuum-swr-replay = "continuum_swr_replay:main"

[build-system]
requires = ["uv_build>=0.8.23,<0.9.0"]
build-backend = "uv_build"
