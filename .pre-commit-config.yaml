# Checks run on the files staged for each commit. Install once with
#   uv run pre-commit install
# The ruff revision matches the version uv.lock pins, so the hook and
# `uv run ruff` format the same way.
# mypy is not run here: src/ does not pass it yet (see TODO.md).

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    # The same scope CI formats and lints; notebooks and the vendored
    # .claude/skills are left as they are.
    hooks:
      - id: ruff-format
        files: ^(src|scripts|tests)/
      - id: ruff
        args: [--fix]
        files: ^(src|scripts|tests)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-merge-conflict
      - id: mixed-line-ending
